name: Ez-RankView
version: '${project.version}'
main: com.ezrankview.EzRankView
api-version: '1.12'
depend: [LuckPerms]
folia-supported: true
authors: [Ez-RankView]
description: A LuckPerms addon which makes switching ranks easier than ever for admins testing out permissions.
website: https://github.com/mrfrenchguy23445/Ez-Rankview

commands:
  rankview:
    description: Preview a LuckPerms rank as yourself or another player.
    usage: /rankview <group> [player] | stop [player] | list | reload
    aliases: [rv, rankpreview]

permissions:
  ezrankview.use:
    description: Preview a rank and list available groups.
    default: op
  ezrankview.others:
    description: Apply or clear a rank preview for another player.
    default: op
  ezrankview.reload:
    description: Reload the Ez-RankView configuration.
    default: op
  ezrankview.admin:
    description: Grants every Ez-RankView permission.
    default: op
    children:
      ezrankview.use: true
      ezrankview.others: true
      ezrankview.reload: true
